dash(){const t=totals(),g=S.goal,rem=Math.max(g.k-t.k,0);const bar=(n,v,m,u)=>`<div style="margin:14px 0"><div class="row sp"><b>${n}</b><span class=mu>${Math.round(v)} / ${m} ${u}</span></div><div class=bar><i data-w=${Math.min(100,v/m*100)}></i></div></div>`;

<div class=g style="margin-top:18px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class=c><h3>Today’s progress</h3>${bar("Calories",t.k,g.k,"kcal")}${bar("Protein",t.p,g.p,"g")}${bar("Carbs",t.c,g.c,"g")}${bar("Fat",t.f,g.f,"g")}<a class=mu style="cursor:pointer;color:var(--or)" data-go=calc>Update my goal</a></div>
<div class=c><h3>Food log</h3>${S.log.length?S.log.map((l,i)=>`<div class="row sp" style="margin:8px 0"><span>${l.n} <span class=mu>×${l.q}</span></span><span><b>${Math.round(l.k)}</b> kcal <button class=hr data-rm=${i} aria-label=Remove>✕</button></span></div>`).join(""):`<p class=mu>No meals yet. Add foods from the database.</p><button class=b data-go=foods>Browse foods</button>`}</div>

let bp="Chest",exQ="",exC="All";

if(r=="body"){const gr=$("#gr");$("#bt").textContent=bp;fill(gr,exCard,E.map((e,i)=>i).filter(i=>E[i][1]==bp))}

function calc(){const v=i=>+$("#"+i).value,w=v("w"),a=v("a"),h=v("h");if(!(w>0&&a>0&&h>0)){$("#res").innerHTML=`<div class=c>Enter your age, height and weight to continue.</div>`;return}
const bmr=10*w+6.25*h-5*a+($("#s").value=="m"?5:-161),tdee=bmr*v("ac"),gl=v("go"),k=Math.max(1200,Math.round(tdee+gl)),p=Math.round(w*(gl<0?2:1.8)),f=Math.round(k*.25/9),c=Math.max(0,Math.round((k-p*4-f*9)/4)),bmi=w/Math.pow(h/100,2);
const st=(n,l)=>`<div class=c><div class=big data-to=${n}>0</div><p class=mu>${l}</p></div>`;

document.addEventListener("click",ev=>{const t=ev.target;

let G=0,last=performance.now(),acc=0;

if(acc>40){acc=0;document.querySelectorAll("svg.mini").forEach(s=>{const r=s.getBoundingClientRect();if(r.bottom>0&&r.top<innerHeight)draw(s,s.dataset.k,G)})}

requestAnimationFrame(frame)}
